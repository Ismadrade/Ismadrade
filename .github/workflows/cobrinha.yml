name: Snake

on:
  # Executa a cada 12 horas (o cron antigo "* */12 * * *" disparava a cada
  # minuto durante 1 hora; "0 */12 * * *" roda apenas nos minutos 0)
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    name: Gerar animacao da cobrinha
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVGs (claro + escuro)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
