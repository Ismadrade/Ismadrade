name: Metrics

on:
  # Executa a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Permite rodar manualmente pela aba "Actions"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    name: Gerar SVGs de metricas
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1) Card principal: cabecalho, atividade, comunidade, repositorios,
      #    linguagens (in-depth) e calendario isometrico de commits.
      # ------------------------------------------------------------------
      - name: Card principal (github-metrics.svg)
        uses: lowlighter/metrics@latest
        with:
          # O GITHUB_TOKEN padrao ja cobre repos publicos. Para dados privados
          # e o plugin lines, gere um PAT classico com escopo "repo" e salve
          # como secret METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Ismadrade
          filename: github-metrics.svg
          template: classic
          config_timezone: America/Sao_Paulo
          committer_message: "chore: atualiza ${filename} [skip ci]"

          base: header, activity, community, repositories

          # Linguagens mais usadas (substitui o antigo "top-langs")
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, scss, tex, dockerfile, makefile

          # Calendario de commits em 3D (ultimo ano)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # NOTA: plugin_habits e plugin_achievements foram removidos por bugs
          # upstream do lowlighter/metrics (habits: "Cannot destructure
          # 'author' of undefined"; achievements: GraphqlResponseError na query
          # AchievementsDefault). Reavaliar quando o projeto corrigir.

      # ------------------------------------------------------------------
      # 2) Card de atividade: issues/PRs em aberto, commits notaveis e
      #    linhas de codigo alteradas.
      # ------------------------------------------------------------------
      - name: Card de atividade (github-metrics-activity.svg)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Ismadrade
          filename: github-metrics-activity.svg
          template: classic
          config_timezone: America/Sao_Paulo
          committer_message: "chore: atualiza ${filename} [skip ci]"

          base: ""

          plugin_followup: yes
          plugin_followup_sections: repositories, user

          plugin_notable: yes
          plugin_notable_types: commit

          plugin_lines: yes

          # NOTA: plugin_activity removido por bug upstream do lowlighter/metrics
          # ("Cannot read properties of undefined (reading 'login')" ao mapear
          # eventos com actor nulo). Reavaliar quando o projeto corrigir.
